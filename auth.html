<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Mac-TE Engineering</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="min-height:100vh; display:flex; justify-content:center; align-items:center; background:linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);">
        <div style="background:#fff; border-radius:20px; padding:40px; width:100%; max-width:420px; box-shadow:0 20px 50px rgba(0,0,0,0.2);">
            <div style="text-align:center; margin-bottom:25px;">
                <h1 style="font-size:28px; font-weight:800; color:#1a1a2e;">Mac-TE <span style="color:#ff9900;">Engineering</span></h1>
                <p style="color:#888; font-size:13px; margin-top:5px;">Sign in to start shopping</p>
            </div>
            
            <div id="login-form" style="display:flex; flex-direction:column; gap:15px;">
                <div style="display:flex; flex-direction:column;">
                    <label style="font-size:12px; font-weight:600; margin-bottom:5px; color:#555;">Email Address</label>
                    <input type="email" id="login-email" placeholder="Enter your email" style="padding:14px; border:1px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none;">
                </div>
                <div style="display:flex; flex-direction:column;">
                    <label style="font-size:12px; font-weight:600; margin-bottom:5px; color:#555;">Password</label>
                    <input type="password" id="login-password" placeholder="Enter your password" style="padding:14px; border:1px solid #e0e0e0; border-radius:10px; font-size:14px; outline:none;">
                </div>
                <button onclick="login()" style="background:#ff9900; color:#fff; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer;">Login</button>
                <p style="text-align:center; margin-top:15px; font-size:13px; color:#888;">Forgot Password? <a href="#" onclick="showForgot()" style="color:#ff9900; font-weight:600; text-decoration:underline;">Reset here</a></p>
                <p style="text-align:center; margin-top:15px; font-size:13px; color:#888;">Don't have an account? <a href="#" onclick="showRegister()" style="color:#ff9900; font-weight:600; text-decoration:underline;">Register here</a></p>
            </div>

            <div id="register-form" style="display:none; flex-direction:column; gap:15px;">
                <div><label style="font-size:12px; font-weight:600; margin-bottom:5px; color:#555;">Full Name</label><input type="text" id="reg-name" placeholder="John Doe" style="padding:14px; border:1px solid #e0e0e0; border-radius:10px; width:100%;"></div>
                <div><label style="font-size:12px; font-weight:600; margin-bottom:5px; color:#555;">Email</label><input type="email" id="reg-email" placeholder="Enter your email" style="padding:14px; border:1px solid #e0e0e0; border-radius:10px; width:100%;"></div>
                <div><label style="font-size:12px; font-weight:600; margin-bottom:5px; color:#555;">Phone</label><input type="tel" id="reg-phone" placeholder="Enter your phone" style="padding:14px; border:1px solid #e0e0e0; border-radius:10px; width:100%;"></div>
                <div><label style="font-size:12px; font-weight:600; margin-bottom:5px; color:#555;">Password</label><input type="password" id="reg-password" placeholder="Create password" style="padding:14px; border:1px solid #e0e0e0; border-radius:10px; width:100%;"></div>
                <button onclick="register()" style="background:#ff9900; color:#fff; padding:14px; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer;">Register</button>
                <p style="text-align:center; margin-top:15px; font-size:13px; color:#888;">Already have an account? <a href="#" onclick="showLogin()" style="color:#ff9900; font-weight:600; text-decoration:underline;">Login here</a></p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
