<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders | Mac-TE Engineering</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .order-card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .order-card h4 { font-size: 15px; font-weight: 700; margin-bottom: 5px; }
        .order-card p { font-size: 13px; color: #666; margin-bottom: 8px; }
        .order-card .total { font-size: 16px; font-weight: 800; color: #ff9900; }
        .order-card .status { color: #ff4757; font-weight: 600; }
        .empty-msg { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="logo" onclick="window.location.href='index.html'">Mac-TE <span>Engineering</span></div>
        <div class="nav-right">
            <div class="nav-link" onclick="window.location.href='index.html'"><i class="fas fa-store"></i> Shop</div>
            <div class="nav-link" onclick="window.location.href='cart.html'"><i class="fas fa-shopping-cart"></i> Cart</div>
            <div class="nav-link" onclick="window.location.href='profile.html'"><i class="fas fa-user"></i> Account</div>
        </div>
    </div>

    <div class="page-container">
        <h2 style="margin-bottom: 20px;">My Orders</h2>
        <div id="orders-list"><div class="empty-msg">Loading orders...</div></div>
    </div>

    <script>
        const BASE_URL = 'https://mac-te-engineering.onrender.com';
        const user = JSON.parse(localStorage.getItem('user'));

        if (!user) { window.location.href = 'auth.html'; }

        async function loadOrders() {
    try {
        const response = await fetch(`${BASE_URL}/api/orders/${user.id}`);
        const orders = await response.json();
        const list = document.getElementById('orders-list');
        
        if (orders.length === 0) {
            list.innerHTML = `<div class="empty-msg">You have no orders.</div>`;
            return;
        }
        
        list.innerHTML = orders.map(order => `
            <div class="order-card">
                <h4>Order #${order.id.slice(0, 8)}</h4>
                <p>${new Date(order.created_at).toLocaleDateString()}</p>
                <div class="total">₦${Number(order.total_amount).toLocaleString()}</div>
                <p class="status">Status: ${order.status}</p>
                <button onclick="trackOrder('${order.id}')" style="background:#ff9900; color:white; border:none; padding:8px 15px; border-radius:6px; cursor:pointer; margin-top:10px;">
                    Track Order
                </button>
            </div>
        `).join('');
    } catch (error) { console.error(error); }
}

async function trackOrder(orderId) {
    try {
        const response = await fetch(`${BASE_URL}/api/orders/track/${orderId}`);
        const order = await response.json();
        alert(`Order Status: ${order.status}\n\nOrder Total: ₦${Number(order.total_amount).toLocaleString()}\n\nPlaced on: ${new Date(order.created_at).toLocaleDateString()}`);
    } catch (error) { alert('Network error.'); }
}

        loadOrders();
    </script>
</body>
</html>
