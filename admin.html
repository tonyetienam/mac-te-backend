<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mac-TE Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body { background: #f5f5f5; color: #333; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { background: #1a1a2e; color: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .header a { background: #ff9900; color: white; text-decoration: none; padding: 8px 12px; border-radius: 5px; font-size: 14px; }
        .header button { background: #ff4757; color: white; border: none; padding: 8px 12px; border-radius: 5px; font-size: 14px; cursor: pointer; }
        .form-card { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .form-card h2 { font-size: 18px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn-primary { background: #ff9900; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; }
        .product-list, .order-list { background: white; border-radius: 10px; overflow: hidden; }
        .product-row, .order-row { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .product-row:last-child, .order-row:last-child { border-bottom: none; }
        .product-row h4, .order-row h4 { font-size: 14px; margin-bottom: 3px; }
        .product-row p, .order-row p { font-size: 13px; color: #666; }
        .delete-btn, .approve-btn { background: #ff4757; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .approve-btn { background: #28a745; }
        .login-screen { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); }
        .login-box { background: #fff; border-radius: 20px; padding: 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        .login-logo { text-align: center; margin-bottom: 25px; }
        .login-logo h1 { font-size: 24px; font-weight: 800; color: #1a1a2e; }
        .login-logo h1 span { color: #ff9900; }
        .input-group { margin-bottom: 15px; }
        .input-group label { font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #555; display: block; }
        .input-group input { width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px; font-size: 14px; outline: none; }
        .btn-login { background: #ff9900; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; }
        .error-msg { color: #ff4757; font-size: 14px; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="login-screen" class="login-screen">
        <div class="login-box">
            <div class="login-logo">
                <h1>Mac-TE <span>Engineering</span></h1>
                <p style="color:#888; font-size:14px; margin-top:10px;">Admin Portal</p>
            </div>
            <div class="input-group">
                <label>Admin Email</label>
                <input type="email" id="admin-email" placeholder="Enter your admin email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="admin-password" placeholder="Enter your password">
            </div>
            <button class="btn-login" onclick="adminLogin()">Login</button>
            <div id="login-error" class="error-msg"></div>
        </div>
    </div>

    <div id="dashboard" style="display:none;">
        <div class="container">
            <div class="header">
                <h1>Mac-TE Admin</h1>
                <div>
                    <a href="index.html">Back to Store</a>
                    <button onclick="logoutAdmin()">Logout</button>
                </div>
            </div>

            <div class="form-card">
                <h2>Add New Product</h2>
                <div class="form-group">
                    <label>Product Name</label>
                    <input type="text" id="product-name" placeholder="e.g. Mac-TE Smart Air Fryer">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="product-description" rows="3" placeholder="Describe your product"></textarea>
                </div>
                <div class="form-group">
                    <label>Price (₦)</label>
                    <input type="number" id="product-price" placeholder="e.g. 45000">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="text" id="product-image" placeholder="Paste image link here">
                </div>
                <div class="form-group">
                    <label>Stock Quantity</label>
                    <input type="number" id="product-stock" placeholder="e.g. 20">
                </div>
                <button class="btn-primary" onclick="addProduct()">Add Product</button>
            </div>

            <div class="form-card">
                <h2>Pending Orders</h2>
                <div class="order-list" id="order-list">
                    <div style="padding:20px; text-align:center; color:#888;">Loading orders...</div>
                </div>
            </div>

            <div class="form-card">
                <h2>All Products</h2>
                <div class="product-list" id="product-list">
                    <div style="padding:20px; text-align:center; color:#888;">Loading products...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'https://mac-te-engineering.onrender.com';
        
        async function adminLogin() {
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-password').value;
            const errorMsg = document.getElementById('login-error');
            errorMsg.innerText = '';

            try {
                const response = await fetch(`${BASE_URL}/api/admin/login`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (data.token) {
                    localStorage.setItem('adminToken', data.token);
                    showDashboard();
                } else {
                    errorMsg.innerText = data.error || 'Invalid credentials';
                }
            } catch (error) { errorMsg.innerText = 'Network error'; }
        }

        function logoutAdmin() {
            localStorage.removeItem('adminToken');
            window.location.reload();
        }

        function showDashboard() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            loadProducts();
            loadOrders();
        }

        async function loadProducts() {
            try {
                const response = await fetch(`${BASE_URL}/api/products`);
                const products = await response.json();
                const list = document.getElementById('product-list');
                if (products.length === 0) {
                    list.innerHTML = `<div style="padding:20px; text-align:center; color:#888;">No products listed.</div>`;
                    return;
                }
                list.innerHTML = products.map(prod => `
                    <div class="product-row">
                        <div>
                            <h4>${prod.name}</h4>
                            <p>₦${Number(prod.price_ngn).toLocaleString()} | Stock: ${prod.stock_quantity}</p>
                        </div>
                        <button class="delete-btn" onclick="deleteProduct('${prod.id}')">Delete</button>
                    </div>
                `).join('');
            } catch (error) { console.error(error); }
        }

        async function addProduct() {
            const name = document.getElementById('product-name').value;
            const description = document.getElementById('product-description').value;
            const price_ngn = document.getElementById('product-price').value;
            const main_image = document.getElementById('product-image').value;
            const stock_quantity = document.getElementById('product-stock').value;

            if (!name || !price_ngn) {
                alert('Please fill in Product Name and Price.');
                return;
            }

            try {
                const response = await fetch(`${BASE_URL}/api/products`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ seller_id: null, category_id: null, name, description, price_ngn: parseFloat(price_ngn), stock_quantity: parseInt(stock_quantity || 0), main_image })
                });
                const data = await response.json();
                if (data.message) {
                    alert('✅ Product added successfully!');
                    document.getElementById('product-name').value = '';
                    document.getElementById('product-description').value = '';
                    document.getElementById('product-price').value = '';
                    document.getElementById('product-image').value = '';
                    document.getElementById('product-stock').value = '';
                    loadProducts();
                } else {
                    alert('Error adding product');
                }
            } catch (error) { alert('Network error. Try again.'); }
        }

        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;
            
            try {
                const response = await fetch(`${BASE_URL}/api/products/${productId}`, { method: 'DELETE' });
                const data = await response.json();
                if (data.message) {
                    alert('Product deleted!');
                    loadProducts();
                }
            } catch (error) { alert('Network error'); }
        }

        async function loadOrders() {
            try {
                const response = await fetch(`${BASE_URL}/api/admin/orders`);
                const orders = await response.json();
                const list = document.getElementById('order-list');
                if (orders.length === 0) {
                    list.innerHTML = `<div style="padding:20px; text-align:center; color:#888;">No orders yet.</div>`;
                    return;
                }
                list.innerHTML = orders.map(order => `
                    <div class="order-row">
                        <div>
                            <h4>Order #${order.id.slice(0, 8)}</h4>
                            <p>${order.full_name} | ₦${Number(order.total_amount).toLocaleString()}</p>
                            <p>Status: ${order.status}</p>
                        </div>
                        <div>
                            <button class="approve-btn" onclick="updateOrderStatus('${order.id}', 'shipped')">Approve</button>
                            <button class="delete-btn" onclick="updateOrderStatus('${order.id}', 'cancelled')">Cancel</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) { console.error(error); }
        }

        async function updateOrderStatus(orderId, status) {
            try {
                const response = await fetch(`${BASE_URL}/api/admin/orders/${orderId}/status`, {
                    method: 'PUT', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const data = await response.json();
                if (data.message) {
                    alert('✅ Order status updated!');
                    loadOrders();
                }
            } catch (error) { alert('Network error'); }
        }
    </script>
</body>
</html>
